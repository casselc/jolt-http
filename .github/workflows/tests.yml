# jolt-http tests.
#
# Chez Scheme is no longer built from source anywhere in this repository. Every
# one of the six lanes installs the SAME immutable, checksum-pinned toolchain
# release (chez-ci-10.4.1.1) through casselc/jolt-toolchains/setup-chez, pinned
# by full commit SHA and requested with an explicit per-target archive SHA-256.
# The action verifies the archive digest, its descriptor, its internal manifest,
# the extracted inventory, and the `source-runtime` capability before exporting
# the executable each lane then uses by exact path. A digest mismatch fails the
# job; there is deliberately no source-build fallback, because a fallback would
# convert a supply-chain failure into a slow green run.
#
# `source-runtime` is the honest capability boundary for jolt-http: the suites
# run Clojure-on-Chez through the source Jolt launcher and link nothing against
# the Chez kernel, so the GNU kernel-development inputs (scheme.h, libkernel.a,
# a cc shim) that the old MSYS2 Windows lane staged are not requested. AOT stays
# disabled on the Windows lanes exactly as before -- tools/test-windows-source.ps1
# sets JOLT_AOT_CACHE=0 -- so nothing here needs a C toolchain either.
#
# What this replaced, per lane: the POSIX matrix cloned cisco/ChezScheme and ran
# configure/make/make install behind a hand-rolled actions/cache entry; Windows
# x86-64 did the same under an MSYS2 MINGW64 toolchain; Windows ARM64 ran
# build.bat tarm64nt over a full ChezScheme checkout. Each cache was keyed by a
# string nothing verified, so a restored toolchain was trusted purely because
# its key matched. None of that remains.
#
# Nothing about coverage changed. All six lanes, their HTTP/runtime/property
# groups, their timeouts, their Hegel-required gates, and the Windows
# architecture witnesses are exactly as they were.

name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  # One reviewed fork revision for every source-mode lane. Keep this centralized
  # so a platform cannot silently validate against a different core.
  JOLT_CORE_SHA: 46e1f74fc14f29283586900ef4b98c45375c0500
  # One immutable toolchain release for all six targets. The per-target archive
  # digests live next to each target below so a wrong pairing cannot pass.
  CHEZ_RELEASE_TAG: chez-ci-10.4.1.1

# Supersede an in-flight run for the same ref. Without this, pushing twice in
# quick succession leaves both runs racing for the same toolchain cache entries.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: POSIX runtime suite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            toolchain: linux-x86_64
            chez_sha256: 16476cd98fb5cb2e2c0285e88fcd6d57ade9392ca8d7cf603ca38432b4118526
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            toolchain: linux-aarch64
            chez_sha256: b5b2306d3d6468b5fc7d5836721b09c704c7750f887a6232f1aeeb567d55f5d9
          - name: macOS arm64
            runner: macos-14
            toolchain: macos-arm64
            chez_sha256: d5b5a504eed1e0f117b4a3dd23ad0030bb3e5c0da6d6b9d9f990f5f2fa32478f
          - name: macOS x86_64
            runner: macos-15-intel
            toolchain: macos-x86_64
            chez_sha256: e4577ad71b1f1e1062c361fa612af60d75378e64dc2869d8c8eefd3d7efdbc62
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Only what the suite actually RUNS with. The former build-essential /
      # liblz4-dev / zlib1g-dev / libncurses-dev / uuid-dev / libssl-dev and
      # brew lz4 / openssl@3 sets existed solely to compile Chez from source,
      # and nothing here compiles Chez any more. zstd is the one genuine
      # addition: the POSIX toolchain archives are .tar.zst, so tar needs a zstd
      # it can reach. It is installed only when absent, so a runner image that
      # already ships it pays nothing.
      - name: Ensure zstd is available (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v zstd >/dev/null 2>&1; then
            echo "zstd already present: $(command -v zstd)"
          else
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Ensure zstd is available (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if command -v zstd >/dev/null 2>&1; then
            echo "zstd already present: $(command -v zstd)"
          else
            brew install zstd
          fi

      # The immutable, digest-pinned toolchain. Replaces the source clone, the
      # configure/make build, and the restore/save cache pair that used to guard
      # it. The action caches the exact validated archive itself, keyed by
      # release tag, target, and digest -- and it saves that cache in a step of
      # its own rather than a post-job hook, so the reason this repository hand
      # rolled restore/save (a red suite skipping the post-job save and paying
      # for a full rebuild on every iteration) no longer applies.
      - name: Install the verified Chez toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3 # chez-ci-10.4.1.1
        with:
          target: ${{ matrix.toolchain }}
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: ${{ matrix.chez_sha256 }}
          capabilities: source-runtime

      - name: Assert official Chez v10.4.1
        shell: bash
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
          CHEZ_TARGET: ${{ steps.chez.outputs.target }}
          CHEZ_ARCHIVE_SHA256: ${{ steps.chez.outputs.archive-sha256 }}
          CHEZ_CACHE_HIT: ${{ steps.chez.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "target        = $CHEZ_TARGET"
          echo "executable    = $CHEZ_EXE"
          echo "archive sha256= $CHEZ_ARCHIVE_SHA256"
          echo "cache hit     = ${CHEZ_CACHE_HIT:-false}"
          test -x "$CHEZ_EXE"
          "$CHEZ_EXE" --version 2>&1 | tee "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt

      # libhegel 0.30.1 has no Darwin/x86_64 release asset. Build the exact
      # tagged source so Intel macOS still runs every HTTP property group.
      # Only the built dylib is cached, keyed on the exact hegel-rust commit and
      # Rust toolchain, so a hit skips the clone, the rustup install and the
      # cargo build alike. Nothing else on this lane depends on the source tree.
      #
      # This is a libhegel concern, NOT a Chez one, and is deliberately kept as
      # it was when the Chez source builds around it were removed.
      - name: Restore built libhegel (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        id: cache-libhegel-macos
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: hegel-build
          key: libhegel-macOS-X64-0.30.1-f81c6cce-rust1.86.0-v1

      - name: Checkout pinned libhegel source (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: hegeldev/hegel-rust
          ref: f81c6cceabe3c6695a249588c751a5ce93dffa00
          persist-credentials: false
          path: hegel-rust

      - name: Build pinned libhegel 0.30.1 (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd hegel-rust
          rustup toolchain install 1.86.0 --profile minimal
          cargo +1.86.0 build --locked -p hegeltest-c --release
          test -f target/release/libhegel_c.dylib
          mkdir -p "$GITHUB_WORKSPACE/hegel-build"
          cp target/release/libhegel_c.dylib "$GITHUB_WORKSPACE/hegel-build/"

      - name: Save built libhegel (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: hegel-build
          key: ${{ steps.cache-libhegel-macos.outputs.cache-primary-key }}

      - name: Publish libhegel path (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          library="$GITHUB_WORKSPACE/hegel-build/libhegel_c.dylib"
          test -f "$library"
          echo "HEGEL_LIBHEGEL_LIBRARY=$library" >> "$GITHUB_ENV"

      - name: Install libhegel
        shell: bash
        env:
          JOLT_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" \
            -A:test -m hegel.install

      # JOLT_HEGEL_REQUIRED matches the Windows lane's -HegelRequired. Installing
      # libhegel is not the same as requiring it: the install step succeeding
      # says nothing about whether any generative case then ran. A missing
      # library already aborts the run at namespace load
      # (:hegel.ffi/library-load-failed, non-zero exit), so what this flag adds
      # is the case that cannot catch — a run that loads libhegel fine and then
      # executes no properties at all. See hegel-support/required?.
      - name: Run tests
        shell: bash
        env:
          JOLT_CHEZ: ${{ steps.chez.outputs.executable }}
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:test

# Windows x86-64 runs the REAL loopback HTTP runtime, not a portable subset.
# The pinned jolt-tcp W6A revision ships a reviewed Windows readiness backend and
# public client, so the former "no socket runtime" caveat is obsolete and no
# runtime or socket group is skipped on this target.
#
# Two lanes, deliberately: a dependency-free HTTP runtime gate that cannot be
# disabled by a jolt-hegel resolution or install failure, and then the complete
# Hegel-required suite. Both run through native PowerShell and invoke Chez
# directly via the runtime's host\chez\cli.ss; neither routes execution through
# bash.
#
# MSYS2 is gone with the source build it existed for. Its one remaining
# non-Chez consumer was the POSIX sh that the source Jolt launcher reads through
# JOLT_SH while resolving the git dependency graph, so this lane now resolves
# Git for Windows' sh.exe explicitly and hands it to the runners -- exactly as
# W11 does -- rather than leaving the script to fall back to a PATH that no
# longer carries an MSYS2 shell.
  windows-runtime:
    name: HTTP runtime suite (Windows x86_64; real loopback)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the verified Chez toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3 # chez-ci-10.4.1.1
        with:
          target: windows-x86_64
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: 360c60496eea2f8aab0e557eb77e9e18b315bb9181938158ae57655aa541b7f8
          capabilities: source-runtime

      - name: Assert official Chez v10.4.1
        shell: pwsh
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
          CHEZ_TARGET: ${{ steps.chez.outputs.target }}
          CHEZ_ARCHIVE_SHA256: ${{ steps.chez.outputs.archive-sha256 }}
          CHEZ_CACHE_HIT: ${{ steps.chez.outputs.cache-hit }}
        run: |
          Write-Host "target         = $env:CHEZ_TARGET"
          Write-Host "executable     = $env:CHEZ_EXE"
          Write-Host "archive sha256 = $env:CHEZ_ARCHIVE_SHA256"
          Write-Host "cache hit      = $env:CHEZ_CACHE_HIT"
          if (-not (Test-Path $env:CHEZ_EXE)) {
            throw "Chez executable not found: $env:CHEZ_EXE"
          }
          $version = (& $env:CHEZ_EXE --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "scheme.exe --version exited $LASTEXITCODE" }
          Write-Host "chez version: $version"
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt

      # The gates declare no :extra-deps, but every alias still resolves the git
      # dependency graph and Jolt derives its git cache key by shelling out, so
      # the launcher reads JOLT_SH before a namespace is loaded. Resolve the real
      # sh.exe here and pass what was actually found, rather than relying on the
      # script's fallback now that no MSYS2 PATH is inherited.
      - name: Locate the runner's sh.exe
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\sh.exe",
            "${env:ProgramFiles(x86)}\Git\bin\sh.exe",
            "C:\Program Files\Git\bin\sh.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sh = if ($candidates) { $candidates[0] } else { (Get-Command sh -ErrorAction SilentlyContinue).Source }
          if (-not $sh) {
            throw "no sh.exe found on this runner; JOLT_SH would point at nothing"
          }
          Write-Host "sh.exe = $sh"
          echo "JOLT_HTTP_SH=$sh" >> $env:GITHUB_ENV

      # Runs FIRST and declares no :extra-deps. Real Windows HTTP socket
      # coverage must not be able to disappear because jolt-hegel failed to
      # resolve or install, so this gate has to be able to pass on its own.
      - name: Run dependency-free HTTP runtime contracts (real loopback)
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          JOLT_HTTP_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_HTTP_CHEZ" `
            -ShellExe "$env:JOLT_HTTP_SH" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:windows-runtime-test' `
            -TimeoutSeconds 900

      - name: Install libhegel and run the complete test suite
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          JOLT_HTTP_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_HTTP_CHEZ" `
            -ShellExe "$env:JOLT_HTTP_SH" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:test' `
            -InstallHegel `
            -HegelRequired `
            -TimeoutSeconds 2400

# Windows ARM64 runs the SAME real-loopback HTTP suite as Windows x86-64, and
# gates on it. The former lane here was a non-gating, socket-free preview that
# asserted jolt.net still failed closed with :unsupported-target; the pinned
# jolt-tcp revision reaches a jolt.net carrying reviewed Winsock readiness for
# aarch64 as well as x86-64, so that premise is gone and the preview with it.
#
# Source-runtime evidence only: native tarm64nt Chez 10.4.1, AOT cache disabled,
# no packaged joltc and no devboot claim. The exact target check in
# windows-runtime-test makes an emulated x86-64 Jolt process fail before the
# positive poller assertion or any HTTP test can pass.
#
# Chez now arrives as the shared digest-pinned tarm64nt toolchain rather than a
# build.bat source build, which removes the ChezScheme checkout, its cache, and
# the MSVC build step. It removes NO architecture evidence: the version and
# (machine-type) witnesses below are now applied to the SHIPPED scheme.exe on
# this runner, so an x86-64 image published under the ARM64 target name fails
# here rather than running under emulation. The descriptor is an additional
# check, never a substitute for executing the binary on real ARM64 hardware.
  windows-arm64-runtime:
    name: HTTP runtime suite (Windows aarch64; real loopback)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
    steps:
      - name: Checkout jolt-http
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The runner label is the only thing selecting this hardware, and a stale
      # or remapped label would otherwise silently downgrade the whole lane to
      # an x86-64 run wearing an ARM64 name.
      - name: Assert the runner is ARM64
        shell: pwsh
        run: |
          Write-Host "runner.arch      = ${{ runner.arch }}"
          Write-Host "PROCESSOR_ARCH   = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "OS architecture  = $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected an ARM64 runner, got '${{ runner.arch }}'"
          }

      - name: Install the verified Chez toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3 # chez-ci-10.4.1.1
        with:
          target: windows-arm64
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: 9bc28462823a1447de6d849e129758a6317cc9deafb8e87414817e7244f149c8
          capabilities: source-runtime

      - name: Checkout pinned Jolt core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt

      # Version alone cannot distinguish a native tarm64nt build from an
      # emulated ta6nt one, so assert (machine-type) too. It is read with
      # --script rather than --eval: --eval does not exit nonzero on a failed
      # expression here, which would let a bad probe report success. Both
      # witnesses run against the executable the shared toolchain shipped, on
      # this ARM64 runner.
      - name: Assert native ARM64 Chez v10.4.1
        shell: pwsh
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
          CHEZ_TARGET: ${{ steps.chez.outputs.target }}
          CHEZ_ARCHIVE_SHA256: ${{ steps.chez.outputs.archive-sha256 }}
          CHEZ_CACHE_HIT: ${{ steps.chez.outputs.cache-hit }}
        run: |
          Write-Host "target         = $env:CHEZ_TARGET"
          Write-Host "executable     = $env:CHEZ_EXE"
          Write-Host "archive sha256 = $env:CHEZ_ARCHIVE_SHA256"
          Write-Host "cache hit      = $env:CHEZ_CACHE_HIT"
          $scheme = $env:CHEZ_EXE
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --version exited $LASTEXITCODE"
          }
          Write-Host "chez version: $version"
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -Path $probe -Value '(display (machine-type))(newline)'
          $machine = (& $scheme --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --script exited $LASTEXITCODE"
          }
          Write-Host "chez machine-type: $machine"
          if ($machine -ne 'tarm64nt') {
            throw "expected Chez machine-type tarm64nt, got '$machine'"
          }
          echo "JOLT_HTTP_CHEZ=$scheme" >> $env:GITHUB_ENV

      # Same reason as the x86-64 lane: the launcher reads JOLT_SH while
      # deriving its git cache key, and Git for Windows is not at an identical
      # path on every image, so resolve it and pass what was actually found.
      - name: Locate the runner's sh.exe
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\sh.exe",
            "${env:ProgramFiles(x86)}\Git\bin\sh.exe",
            "C:\Program Files\Git\bin\sh.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sh = if ($candidates) { $candidates[0] } else { (Get-Command sh -ErrorAction SilentlyContinue).Source }
          if (-not $sh) {
            throw "no sh.exe found on this runner; JOLT_SH would point at nothing"
          }
          Write-Host "sh.exe = $sh"
          echo "JOLT_HTTP_SH=$sh" >> $env:GITHUB_ENV

      # Runs FIRST and declares no :extra-deps, exactly as on x86-64. Real
      # Windows HTTP socket coverage must not be able to disappear because
      # jolt-hegel failed to resolve or install.
      - name: Run dependency-free HTTP runtime contracts (real loopback)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_HTTP_CHEZ" `
            -ShellExe "$env:JOLT_HTTP_SH" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:windows-runtime-test' `
            -TimeoutSeconds 900

      - name: Install libhegel and run the complete test suite
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_HTTP_CHEZ" `
            -ShellExe "$env:JOLT_HTTP_SH" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:test' `
            -InstallHegel `
            -HegelRequired `
            -TimeoutSeconds 2400
