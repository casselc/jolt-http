name: tests

on: [push, pull_request, workflow_dispatch]

# Supersede an in-flight run for the same ref. Without this, pushing twice in
# quick succession leaves both runs racing: every toolchain cache is written at
# the END of a job, so concurrent runs all miss the cache the others are about
# to populate and each rebuilds Chez from source. That cost 9m28s on macOS
# x86_64 alone in one observed run, for a commit that was already superseded.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: POSIX runtime suite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-14
          - name: macOS x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install source-build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev \
            libncurses-dev uuid-dev libssl-dev

      - name: Install source-build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 openssl@3

      # restore/save rather than actions/cache, deliberately. actions/cache only
      # writes its cache in a post-job step, which is SKIPPED when the job
      # fails — so a lane whose tests are red can never populate its toolchain
      # cache and rebuilds Chez from source on every iteration. That is exactly
      # what happened on Windows x86_64: 6m46s of Chez rebuild per run, for a
      # ~90s test suite, on every attempt until the suite went green.
      #
      # The matching save steps run immediately after Chez is asserted good and
      # BEFORE any test step, so the cache is populated by a validated build and
      # a test failure cannot suppress it.
      - name: Restore Chez Scheme (Linux)
        if: runner.os == 'Linux'
        id: cache-chez-linux
        uses: actions/cache/restore@v4
        with:
          path: ~/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-x11off-v1

      - name: Build official Chez Scheme v10.4.1 from source (Linux)
        if: runner.os == 'Linux' && steps.cache-chez-linux.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --installprefix="$HOME/chez" --threads --disable-x11
          make -j"$(nproc)"
          make install

      - name: Restore Chez Scheme (macOS)
        if: runner.os == 'macOS'
        id: cache-chez-macos
        uses: actions/cache/restore@v4
        with:
          path: ~/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-x11off-v1

      - name: Build official Chez Scheme v10.4.1 from source (macOS)
        if: runner.os == 'macOS' && steps.cache-chez-macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --installprefix="$HOME/chez" --threads --disable-x11
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Provide and assert official Chez v10.4.1
        shell: bash
        run: |
          set -euo pipefail
          bindir="$HOME/chez/bin"
          test -x "$bindir/scheme"
          printf '#!/bin/sh\nexec %s "$@"\n' "$bindir/scheme" > "$bindir/chez"
          chmod +x "$bindir/chez"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/chez" --version | tee /tmp/chez-version
          grep -Fq '10.4.1' /tmp/chez-version

      # Saved here, not in a post-job step: Chez has just been asserted good and
      # no test has run yet, so a red suite cannot cost the next run a rebuild.
      - name: Save Chez Scheme (Linux)
        if: runner.os == 'Linux' && steps.cache-chez-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/chez
          key: ${{ steps.cache-chez-linux.outputs.cache-primary-key }}

      - name: Save Chez Scheme (macOS)
        if: runner.os == 'macOS' && steps.cache-chez-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/chez
          key: ${{ steps.cache-chez-macos.outputs.cache-primary-key }}

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: 85f645aa1178e4b631198dcbaf46bdad1283750b
          submodules: recursive
          path: jolt

      # libhegel 0.30.1 has no Darwin/x86_64 release asset. Build the exact
      # tagged source so Intel macOS still runs every HTTP property group.
      # Only the built dylib is cached, keyed on the exact hegel-rust commit and
      # Rust toolchain, so a hit skips the clone, the rustup install and the
      # cargo build alike. Nothing else on this lane depends on the source tree.
      - name: Restore built libhegel (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        id: cache-libhegel-macos
        uses: actions/cache/restore@v4
        with:
          path: hegel-build
          key: libhegel-macOS-X64-0.30.1-f81c6cce-rust1.86.0-v1

      - name: Checkout pinned libhegel source (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: hegeldev/hegel-rust
          ref: f81c6cceabe3c6695a249588c751a5ce93dffa00
          persist-credentials: false
          path: hegel-rust

      - name: Build pinned libhegel 0.30.1 (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd hegel-rust
          rustup toolchain install 1.86.0 --profile minimal
          cargo +1.86.0 build --locked -p hegeltest-c --release
          test -f target/release/libhegel_c.dylib
          mkdir -p "$GITHUB_WORKSPACE/hegel-build"
          cp target/release/libhegel_c.dylib "$GITHUB_WORKSPACE/hegel-build/"

      - name: Save built libhegel (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hegel-build
          key: ${{ steps.cache-libhegel-macos.outputs.cache-primary-key }}

      - name: Publish libhegel path (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          library="$GITHUB_WORKSPACE/hegel-build/libhegel_c.dylib"
          test -f "$library"
          echo "HEGEL_LIBHEGEL_LIBRARY=$library" >> "$GITHUB_ENV"

      - name: Install libhegel
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/joltc" \
            -A:test -m hegel.install

      # JOLT_HEGEL_REQUIRED matches the Windows lane's -HegelRequired. Installing
      # libhegel is not the same as requiring it: the install step succeeding
      # says nothing about whether any generative case then ran. A missing
      # library already aborts the run at namespace load
      # (:hegel.ffi/library-load-failed, non-zero exit), so what this flag adds
      # is the case that cannot catch — a run that loads libhegel fine and then
      # executes no properties at all. See hegel-support/required?.
      - name: Run tests
        shell: bash
        env:
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/joltc" -M:test

# Windows x86-64 now runs the REAL loopback HTTP runtime, not a portable subset.
# The pinned jolt-tcp W6A revision ships a reviewed Windows readiness backend and
# public client, so the former "no socket runtime" caveat is obsolete and no
# runtime or socket group is skipped on this target.
#
# Two lanes, deliberately: a dependency-free HTTP runtime gate that cannot be
# disabled by a jolt-hegel resolution or install failure, and then the complete
# Hegel-required suite. Both run through native PowerShell and invoke Chez
# directly via the runtime's host\chez\cli.ss; neither routes execution through
# bash. MSYS2 is present only to source-build Chez itself.
  windows-runtime:
    name: HTTP runtime suite (Windows x86_64; real loopback)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 source-build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib

      # See the POSIX lane for why this is restore/save rather than
      # actions/cache. This job is where it mattered most: its post-job save was
      # skipped on every failing run, so it rebuilt Chez (6m46s) on each
      # iteration of a ~90s suite and never once populated the cache.
      - name: Restore Chez Scheme
        id: cache-chez-windows
        uses: actions/cache/restore@v4
        with:
          path: chez-install
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-mingw64-v1

      - name: Build official Chez Scheme v10.4.1 from source
        if: steps.cache-chez-windows.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --threads
          make -j"$(nproc)"
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/"

      - name: Provide and assert official Chez v10.4.1
        run: |
          set -euo pipefail
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          test -x "$bindir/scheme.exe"
          { echo '#!/bin/sh'; echo "exec \"$bindir/scheme.exe\" \"\$@\""; } > "$bindir/chez"
          { echo '#!/bin/sh'; echo 'exec gcc "$@"'; } > "$bindir/cc"
          chmod +x "$bindir/chez" "$bindir/cc"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "JOLT_CHEZ_CSV=$GITHUB_WORKSPACE/chez-install/csv" >> "$GITHUB_ENV"
          "$bindir/chez" --version | tee "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      # Saved before any test runs, so a red suite cannot cost the next run a
      # 6m46s Chez rebuild.
      - name: Save Chez Scheme
        if: steps.cache-chez-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: chez-install
          key: ${{ steps.cache-chez-windows.outputs.cache-primary-key }}

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: 85f645aa1178e4b631198dcbaf46bdad1283750b
          submodules: recursive
          path: jolt

      # Runs FIRST and declares no :extra-deps. Real Windows HTTP socket
      # coverage must not be able to disappear because jolt-hegel failed to
      # resolve or install, so this gate has to be able to pass on its own.
      - name: Run dependency-free HTTP runtime contracts (real loopback)
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-install\bin\scheme.exe" `
            -TestAlias '-M:windows-runtime-test' `
            -TimeoutSeconds 900

      - name: Install libhegel and run the complete test suite
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-install\bin\scheme.exe" `
            -TestAlias '-M:test' `
            -InstallHegel `
            -HegelRequired `
            -TimeoutSeconds 2400

# Windows ARM64 has no reviewed jolt.net descriptor yet. This public-preview
# lane therefore runs only the explicit descriptor-independent HTTP tests and
# verifies that the transport dependency fails closed. It is native source-mode
# Jolt over tarm64nt Chez: no packaged joltc, devboot, AOT cache, HTTP listener,
# or Winsock runtime claim.
  windows-arm64-source-preview:
    name: source-mode HTTP preview (Windows aarch64; non-AOT, no sockets)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 35
    continue-on-error: true
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
    steps:
      - name: Checkout jolt-http
        uses: actions/checkout@v4

      # This lane previously had no cache at all and rebuilt tarm64nt Chez from
      # source on every run (~7 min) to execute a handful of descriptor-
      # independent tests. Only the built output is cached; the checkout below
      # is skipped on a hit, so nothing is cloned either.
      - name: Restore native ARM64 Chez Scheme
        id: cache-chez-arm64
        uses: actions/cache/restore@v4
        with:
          path: chez-arm64/tarm64nt
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-tarm64nt-v1

      - name: Checkout official Chez Scheme v10.4.1
        if: steps.cache-chez-arm64.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: cisco/ChezScheme
          ref: v10.4.1
          submodules: recursive
          persist-credentials: false
          path: chez-arm64

      - name: Build native ARM64 Chez Scheme from source
        if: steps.cache-chez-arm64.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\chez-arm64"
          call build.bat tarm64nt /only

      - name: Checkout pinned Jolt core
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: 85f645aa1178e4b631198dcbaf46bdad1283750b
          submodules: recursive
          path: jolt

      - name: Assert native ARM64 Chez for source-mode Jolt
        shell: pwsh
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE `
            'chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe'
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $version
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }

      # Saved only after the build above has been asserted good, and before the
      # preview runs, so a red preview cannot cost the next run a full rebuild.
      - name: Save native ARM64 Chez Scheme
        if: steps.cache-chez-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: chez-arm64/tarm64nt
          key: ${{ steps.cache-chez-arm64.outputs.cache-primary-key }}

      # One checked-in main covers both preview claims: the descriptor-independent
      # HTTP tests actually run on native ARM64, AND jolt.net still fails closed
      # with :unsupported-target before its reviewed ARM64 descriptor exists. It
      # declares no jolt-hegel dependency, so W6A's Windows ARM64 jolt-hegel
      # installer/Get-FileHash blocker cannot silence the fail-closed assertion.
      # This lane is continue-on-error and claims NO socket-runtime support.
      - name: Run the descriptor-independent HTTP preview (fail-closed transport)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltHttpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe" `
            -TestAlias '-M:windows-arm64-preview' `
            -TimeoutSeconds 600
